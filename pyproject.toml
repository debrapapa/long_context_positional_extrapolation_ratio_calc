[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debrapapa-long_context_positional_extrapolation_ratio_calc"
version = "0.1.0"
description = "从输入中抽取数值，计算量化与稀疏化研究员·长上下文的位置编码外推相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "debrapapa" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://debrapapa.github.io"
Repository = "https://github.com/debrapapa/long_context_positional_extrapolation_ratio_calc"
Issues = "https://github.com/debrapapa/long_context_positional_extrapolation_ratio_calc/issues"

[project.scripts]
long_context_positional_extrapolation_ratio_calc = "long_context_positional_extrapolation_ratio_calc:main"

[tool.setuptools]
py-modules = ["long_context_positional_extrapolation_ratio_calc"]
